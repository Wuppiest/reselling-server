<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reselling Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#f7f4ef;--card:#fff;--ink:#241d15;--mute:#74685a;--line:#e6dfd3;--acc:#9a5a12;--accbg:#f6e7cd;--onacc:#fff;--ok:#157a4a;--okbg:#e2f4ea;--warn:#9a5700;--warnbg:#fdf0dc;--bad:#b9302a;--badbg:#fbe7e5;--f:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;--m:"IBM Plex Mono",ui-monospace,Consolas,monospace;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131110;--card:#1c1916;--ink:#f0ebe3;--mute:#9a9084;--line:#2f2a24;--acc:#e3a94f;--accbg:#3a2c15;--onacc:#1c1208;--ok:#4fd08c;--okbg:#14301f;--warn:#f0b35a;--warnbg:#3a2a10;--bad:#ff8a80;--badbg:#3d1a18}}
:root[data-theme="dark"]{--bg:#131110;--card:#1c1916;--ink:#f0ebe3;--mute:#9a9084;--line:#2f2a24;--acc:#e3a94f;--accbg:#3a2c15;--onacc:#1c1208;--ok:#4fd08c;--okbg:#14301f;--warn:#f0b35a;--warnbg:#3a2a10;--bad:#ff8a80;--badbg:#3d1a18}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--f)}
header{display:flex;align-items:center;gap:12px;padding:14px 24px;border-bottom:1px solid var(--line);background:var(--card)}
.logo{width:40px;height:auto;display:block}
.brand{font-weight:600;line-height:1.2}.brand small{display:block;font-weight:400;font-size:12.5px;color:var(--mute)}
.sp{flex:1}
main{display:grid;grid-template-columns:260px minmax(0,1fr) 320px;gap:20px;padding:20px 24px 48px;max-width:1280px;margin:auto;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px}
h2{font-size:16px;font-weight:600;margin:0 0 2px}
h3{font-size:14px;font-weight:600;margin:0 0 2px}
.hint{color:var(--mute);font-size:13px;margin:0 0 12px}
label.l{display:block;font-size:13px;font-weight:500;margin:12px 0 4px}
input[type=text],input[type=date],input[type=time]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;color-scheme:light dark}
input.bad{border-color:var(--bad);background:var(--badbg)}
input:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.err{color:var(--bad);font-size:12.5px;margin-top:3px}.err:empty{display:none}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.g3{display:grid;grid-template-columns:1fr 1fr auto;gap:0 10px;align-items:end}
.btn{background:var(--acc);color:var(--onacc);border:0;border-radius:6px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer}
.btn.sec{background:var(--accbg);color:var(--acc)}
.btn.link{background:none;color:var(--mute);font-weight:400;text-decoration:underline;padding:0}
.btn.danger{background:var(--badbg);color:var(--bad)}
.row2{display:flex;gap:8px}
.btn.full{width:100%}
.btn.now{padding:9px 12px;margin-bottom:0}
button:disabled{opacity:.45;cursor:not-allowed}
.sect{border-top:1px solid var(--line);margin-top:18px;padding-top:16px}
.chk{display:flex;gap:8px;align-items:center;margin:4px 0}
.item{display:block;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:6px;padding:8px 10px;font:inherit;color:var(--ink);cursor:pointer;margin-bottom:2px}
.item:hover{background:var(--bg)}.item.on{background:var(--accbg);border-color:var(--acc)}
.item b{font-weight:600;font-family:var(--m);font-size:13.5px}
.item small{display:block;color:var(--mute);font-size:12.5px}
.tag{float:right;font-size:11.5px;font-weight:500;border-radius:99px;padding:1px 8px}
.t0{background:var(--line);color:var(--mute)}.t1{background:var(--accbg);color:var(--acc)}.t2{background:var(--okbg);color:var(--ok)}
.new{display:grid;gap:8px;margin-bottom:18px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.new .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.new input{padding:7px 9px}
.pre{display:flex;align-items:center;border:1px solid var(--line);border-radius:6px;background:var(--bg)}.pre:focus-within{outline:2px solid var(--acc);outline-offset:1px}.pre span{padding-left:10px;font-family:var(--m);font-weight:500;color:var(--ink);user-select:none}.new .pre input{border:0;background:transparent;padding-left:2px;outline:none}
.side{position:sticky;top:16px}
pre{white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:12px;font:400 13px/1.7 var(--m);margin:0 0 10px;min-height:110px}
.box{border-radius:6px;padding:9px 12px;font-size:13.5px;margin:0 0 10px}
.box.bad{background:var(--badbg);color:var(--bad)}.box.warn{background:var(--warnbg);color:var(--warn)}
.box ul{margin:4px 0 0;padding-left:18px}
.empty{color:var(--mute);padding:28px 10px;text-align:center}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
[hidden]{display:none!important}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:6px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (max-width:1040px){main{grid-template-columns:1fr}.side{position:static}}
@media (max-width:520px){.g2{grid-template-columns:1fr}header,main{padding-left:14px;padding-right:14px}}
</style>
</head>

<script>
"use strict";
const STORE = "rs_v2";
const STATUS = ["Offen", "Online", "Verkauft"];
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const S = { items: [], cur: -1, touched: new Set() };
try { S.items = JSON.parse(localStorage.getItem(STORE) || "[]"); } catch (e) { S.items = []; }
const persist = () => { try { localStorage.setItem(STORE, JSON.stringify(S.items)); } catch (e) {} };
const cur = () => S.items[S.cur] || null;

/* ---------- Helfer ---------- */
function money(str) {
  const s = String(str ?? "").trim().replace(/€|\s/g, "").replace(",", ".");
  return /^\d{1,6}(\.\d{1,2})?$/.test(s) ? Number(s) : null;
}
const eur = n => n.toFixed(2).replace(".", ",") + " euro";
const pad = n => String(n).padStart(2, "0");
const stamp = (d, t) => (d && t) ? new Date(d + "T" + t) : null;
const fmtStamp = (d, t) => { const [y, m, day] = d.split("-").map(Number); return t + " am " + day + "." + m + "." + y; };
function nowParts() {
  const n = new Date();
  return { d: n.getFullYear() + "-" + pad(n.getMonth() + 1) + "-" + pad(n.getDate()), t: pad(n.getHours()) + ":" + pad(n.getMinutes()) };
}
function duration(a, b) {
  const min = Math.round((b - a) / 60000), d = Math.floor(min / 1440), h = Math.floor(min % 1440 / 60), m = min % 60;
  return d ? d + " Tg. " + h + " Std." : h ? h + " Std. " + m + " Min." : m + " Min.";
}
const status = i => i.sDate && i.sTime && i.sPrice ? 2 : i.onDate && i.onTime ? 1 : 0;
function toast(t) { const e = $("toast"); e.textContent = t; e.classList.add("show"); clearTimeout(toast.h); toast.h = setTimeout(() => e.classList.remove("show"), 2000); }
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) { const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove(); }
}

/* ---------- Prüfung ---------- */
// req = Pflichtfeld fehlt; wird erst angezeigt, wenn das Feld angefasst wurde.
function check(i) {
  const err = {}, warn = [], now = Date.now() + 60000;
  const bad = (k, msg, req) => { if (!err[k]) err[k] = { msg, req: !!req }; };
  const when = (dk, tk) => {
    if (!i[dk] && !i[tk]) { bad(dk, "Datum fehlt", 1); bad(tk, "Uhrzeit fehlt", 1); return null; }
    if (!i[dk]) { bad(dk, "Datum fehlt", 1); return null; }
    if (!i[tk]) { bad(tk, "Uhrzeit fehlt (z. B. 14:35)", 1); return null; }
    const d = stamp(i[dk], i[tk]);
    if (isNaN(d)) { bad(dk, "Ungültiges Datum oder Uhrzeit"); return null; }
    if (d > now) { bad(dk, "Liegt in der Zukunft"); return null; }
    return d;
  };
  const amount = (k, allowZero) => {
    if (!String(i[k] ?? "").trim()) { bad(k, "Betrag fehlt", 1); return null; }
    const v = money(i[k]);
    if (v === null) { bad(k, "Ungültiger Betrag, so: 12,33"); return null; }
    if (!allowZero && v === 0) { bad(k, "Muss größer als 0 sein"); return null; }
    return v;
  };

  if (!i.codeOk) bad("codeOk", "Bitte bestätigen: Lagercode steht in der Beschreibung", 1);
  const on = when("onDate", "onTime");
  const buy = amount("buy", true);

  const soldStarted = ["sDate", "sTime", "sPrice", "ship"].some(k => String(i[k] ?? "").trim());
  let sold = null, sp = null, ship = null;
  if (soldStarted) {
    sold = when("sDate", "sTime");
    sp = amount("sPrice", false);
    ship = amount("ship", true);
    if (on && sold && sold < on) bad("sDate", "Verkauf liegt vor dem Online-Zeitpunkt");
  }
  if (sp !== null) {
    const lo = money(i.min), hi = money(i.max);
    if (lo !== null && sp < lo) warn.push("Verkaufspreis liegt unter der Preisvorgabe (ab " + i.min + " €).");
  }
  return { err, warn, on, sold, buy, sp, ship, soldStarted };
}

/* ---------- Steckbrief ---------- */
function steckbrief(i) {
  const c = check(i), L = [];
  const add = (k, v) => L.push(k + "=" + v);
  add("lagercode", i.code);
  add("status", STATUS[status(i)]);
  if (i.min || i.max) add("preisvorgabe", (i.min || "?") + " bis " + (i.max || "?") + " euro");
  add("online seit", fmtStamp(i.onDate, i.onTime));
  add("lagercode in beschreibung", "ja");
  add("einkaufspreis", eur(c.buy));
  if (c.soldStarted) {
    add("verkaufspreis", eur(c.sp));
    add("verkauft um", fmtStamp(i.sDate, i.sTime));
    add("standzeit", duration(c.on, c.sold));
    add("versandkosten", eur(c.ship));
    const lo = money(i.min), hi = money(i.max);
    if (lo !== null) add("im preisrahmen", c.sp < lo ? "NEIN" : "ja");
    add("gewinn", eur(c.sp - c.buy - c.ship));
  }
  return L.join("\n");
}

/* ---------- Anzeige ---------- */
function field(k, label, type) {
  const attr = type === "text" ? ' inputmode="decimal" placeholder="0,00" data-money="1"' : "";
  return `<div><label class="l" for="f_${k}">${label}</label><input type="${type}" id="f_${k}" data-k="${k}" value="${esc(cur()[k] ?? "")}"${attr}><div class="err" id="e_${k}"></div></div>`;
}
const dateRow = (p, ctx) => `<div class="g3">${field(p + "Date", "Datum", "date")}${field(p + "Time", "Uhrzeit", "time")}<div><button type="button" class="btn sec now" data-now="${p}">Jetzt</button><div class="err"></div></div></div>`;

function renderList() {
  $("list").innerHTML = S.items.length
    ? S.items.map((i, n) => `<button type="button" class="item${n === S.cur ? " on" : ""}" data-n="${n}"><span class="tag t${status(i)}">${STATUS[status(i)]}</span><b>${esc(i.code)}</b><small>${i.saved ? "Steckbrief gespeichert" : "Kein Steckbrief"}</small></button>`).join("")
    : '<div class="empty">Noch keine Aufträge. Lege oben den ersten an.</div>';
}
const delAsk = (ask, i) => ask
  ? `<p class="hint">${esc(i.code)} wirklich löschen? Das lässt sich nicht rückgängig machen.</p><div class="row2"><button type="button" class="btn danger" id="delyes">Ja, löschen</button><button type="button" class="btn sec" id="delno">Abbrechen</button></div>`
  : '<button type="button" class="btn danger" id="del">Auftrag löschen</button>';
const soldOpen = i => i.soldOpen || ["sDate", "sTime", "sPrice", "ship"].some(k => String(i[k] ?? "").trim());
const soldBlock = i => soldOpen(i)
  ? `<div class="sect"><h3>Verkauft</h3>${dateRow("s")}<div class="g2">${field("sPrice", "Verkaufspreis (€)", "text")}${field("ship", "Versandkosten (€, 0 wenn keine)", "text")}</div><button type="button" class="btn link" id="unsold" style="margin-top:12px">Verkauf zurücknehmen</button></div>`
  : '<div class="sect"><h3>Verkauft</h3><p class="hint">Noch nicht verkauft.</p><button type="button" class="btn sec" id="sold">Als verkauft markieren</button></div>';
function renderForm() {
  const i = cur(), el = $("form");
  S.touched.clear();
  if (!i) { el.innerHTML = '<div class="empty">Wähle links einen Auftrag aus oder lege einen neuen an.</div>'; refresh(); return; }
  const range = (i.min || i.max) ? `Preisvorgabe: <b>${esc(i.min || "?")} bis ${esc(i.max || "?")} €</b>` : "Keine Preisvorgabe hinterlegt.";
  el.innerHTML = `
    <h2>${esc(i.code)}</h2><p class="hint">${range}</p>
    <div class="sect"><h3>Online gestellt</h3>
      <div class="chk"><input type="checkbox" id="f_codeOk" data-c="codeOk"${i.codeOk ? " checked" : ""}><label for="f_codeOk">Lagercode steht in der Vinted-Beschreibung</label></div>
      <div class="err" id="e_codeOk"></div>
      ${dateRow("on")}
      ${field("buy", "Einkaufspreis (€)", "text")}
    </div>
    ${soldBlock(i)}
    <div class="sect" id="delbox">${delAsk(false, i)}</div>`;
  refresh();
}
function showErrors() {
  const i = cur(); if (!i) return;
  const { err } = check(i);
  document.querySelectorAll("#form .err[id]").forEach(e => {
    const k = e.id.slice(2), x = err[k], show = x && (!x.req || S.touched.has(k));
    e.textContent = show ? x.msg : "";
    const inp = $("f_" + k); if (inp && inp.type !== "checkbox") inp.classList.toggle("bad", !!show);
  });
}
function showSB() {
  const i = cur(), c = i && check(i), box = $("msg");
  let text = "", valid = false; box.innerHTML = "";
  if (!i) text = "Noch kein Auftrag ausgewählt.";
  else {
    const errs = Object.values(c.err);
    if (errs.length) {
      box.innerHTML = '<div class="box bad">Noch offen:<ul>' + [...new Set(errs.map(e => e.msg))].map(m => "<li>" + esc(m) + "</li>").join("") + "</ul></div>";
      text = "Steckbrief erscheint, sobald alle Angaben passen.";
    } else {
      valid = true; text = steckbrief(i);
      if (c.warn.length) box.innerHTML = '<div class="box warn">Bitte prüfen:<ul>' + c.warn.map(w => "<li>" + esc(w) + "</li>").join("") + "</ul></div>";
    }
  }
  $("sb").textContent = text;
  if (valid && i.saved !== text) {
    const n = nowParts();
    i.saved = text; i.savedAt = n.t + " am " + Number(n.d.slice(8)) + "." + Number(n.d.slice(5, 7)) + "." + n.d.slice(0, 4);
    persist(); enqueue(i, c);
  }
  $("copy").disabled = !valid;
  $("share").disabled = !valid;
  $("savedinfo").textContent = !i || !i.saved ? "" : (valid ? "Automatisch gespeichert am " : "Letzter gespeicherter Stand: ") + i.savedAt + " Uhr.";
}
function refresh() { showErrors(); showSB(); renderList(); }

/* ---------- Aktionen ---------- */
$("nc").addEventListener("input", e => { e.target.value = e.target.value.replace(/\D/g, "").slice(0, 6); });
$("newForm").onsubmit = ev => {
  ev.preventDefault();
  const raw = $("nc").value.replace(/\D/g, "").slice(0, 6), code = raw ? "LC-" + raw : "";
  const lo = $("nmin").value.trim(), hi = $("nmax").value.trim();
  const e = { nc: "", nmin: "", nmax: "" };
  if (!code) e.nc = "Lagercode fehlt";
  else if (S.items.some(i => i.code.toLowerCase() === code.toLowerCase())) e.nc = "Diesen Lagercode gibt es schon";
  if (lo && money(lo) === null) e.nmin = "Ungültig, so: 12,33";
  if (hi && money(hi) === null) e.nmax = "Ungültig, so: 12,33";
  if (!e.nmin && !e.nmax && lo && hi && money(lo) > money(hi)) e.nmax = "Muss größer als „von“ sein";
  for (const k in e) $("e_" + k).textContent = e[k];
  if (e.nc || e.nmin || e.nmax) return;
  S.items.unshift({ code, min: lo, max: hi });
  S.cur = 0; ["nmin", "nmax"].forEach(k => $(k).value = ""); $("nc").value = "";
  persist(); enqueue(S.items[0], null); renderForm(); toast("Auftrag angelegt");
};
$("list").onclick = e => { const b = e.target.closest(".item"); if (b) { S.cur = +b.dataset.n; renderForm(); } };

const form = $("form");
form.addEventListener("input", e => {
  const i = cur(), k = e.target.dataset.k;
  if (i && k) { i[k] = e.target.value; persist(); refresh(); }
});
form.addEventListener("change", e => {
  const i = cur(), k = e.target.dataset.c;
  if (i && k) { i[k] = e.target.checked; S.touched.add(k); persist(); refresh(); }
});
form.addEventListener("focusout", e => {
  const i = cur(), t = e.target, k = t.dataset && t.dataset.k;
  if (!i || !k) return;
  S.touched.add(k);
  if (t.dataset.money) { const v = money(t.value); if (v !== null) { t.value = v.toFixed(2).replace(".", ","); i[k] = t.value; persist(); } }
  refresh();
});
form.addEventListener("click", e => {
  const i = cur(); if (!i) return;
  const p = e.target.dataset.now;
  if (p) {
    const n = nowParts();
    i[p + "Date"] = n.d; i[p + "Time"] = n.t;
    $("f_" + p + "Date").value = n.d; $("f_" + p + "Time").value = n.t;
    S.touched.add(p + "Date"); S.touched.add(p + "Time"); persist(); refresh();
  }
  const id = e.target.id;
  if (id === "sold") {
    const n = nowParts(); i.soldOpen = true; i.sDate = n.d; i.sTime = n.t; persist(); renderForm();
    const f = $("f_sPrice"); if (f) f.focus();
    return;
  }
  if (id === "unsold") {
    ["sDate", "sTime", "sPrice", "ship"].forEach(k => delete i[k]); i.soldOpen = false; persist(); renderForm();
    return;
  }
  if (id === "del" || id === "delno") $("delbox").innerHTML = delAsk(id === "del", i);
  if (id === "delyes") { enqueueDel(i.code); S.items.splice(S.cur, 1); S.cur = -1; persist(); renderForm(); toast("Auftrag gelöscht"); }
});
$("copy").onclick = async () => { const i = cur(); if (i && i.saved) { await copyText(i.saved); toast("Kopiert"); } };
$("share").onclick = async () => {
  const i = cur(); if (!i || !i.saved) return;
  if (navigator.share) { try { await navigator.share({ text: i.saved }); return; } catch (e) { if (e.name === "AbortError") return; } }
  await copyText(i.saved); toast("Teilen nicht möglich, Steckbrief kopiert");
};
$("all").onclick = async () => {
  const all = S.items.filter(i => i.saved).map(i => i.saved);
  if (!all.length) { toast("Noch keine gespeicherten Steckbriefe"); return; }
  await copyText(all.join("\n\n----------\n\n")); toast(all.length + " Steckbriefe kopiert");
};

/* ---------- Server-Sync (Render) ---------- */
const QK = "rs_queue", KK = "rs_key";
let Q = {}, busy = false, syncErr = "", noKey = false, okAt = 0;
try { Q = JSON.parse(localStorage.getItem(QK) || "{}"); } catch (e) {}
const saveQ = () => { try { localStorage.setItem(QK, JSON.stringify(Q)); } catch (e) {} };
function body(i, c) {
  const lo = money(i.min), o = { code: i.code, status: "Offen", min: lo, max: money(i.max), on: null, buy: null, sold: null, sp: null, ship: null, desc: null, inr: null, g: null, text: i.saved || "" };
  if (!c) return o;
  o.status = STATUS[status(i)]; o.on = +c.on; o.buy = c.buy; o.desc = true;
  if (c.soldStarted) { o.sold = +c.sold; o.sp = c.sp; o.ship = c.ship; o.inr = lo !== null ? !(c.sp < lo) : null; o.g = Math.round((c.sp - c.buy - c.ship) * 100) / 100; }
  return o;
}
function enqueue(i, c) { Q[i.code] = { op: "put", b: body(i, c) }; saveQ(); flush(); }
function enqueueDel(code) { Q[code] = { op: "del" }; saveQ(); flush(); }
function syncAll() {
  for (const i of S.items) {
    if (Q[i.code]) continue;
    const c = check(i);
    if (!Object.keys(c.err).length) Q[i.code] = { op: "put", b: body(i, c) };
    else if (!i.saved) Q[i.code] = { op: "put", b: body(i, null) };
  }
  saveQ(); flush();
}
function paint() {
  const n = Object.keys(Q).length;
  $("sync").textContent = syncErr ? "Server: " + syncErr + (n ? " (" + n + " offen)" : "") : n ? "Sync: " + n + " offen" : okAt ? "Server verbunden ✓" : "";
}
async function flush() {
  const codes = Object.keys(Q);
  if (busy || !codes.length) return paint();
  let key = localStorage.getItem(KK) || "";
  if (!key && !noKey) { key = (prompt("Zugangscode für den Server (Schreiben):") || "").trim(); if (key) localStorage.setItem(KK, key); else noKey = true; }
  if (!key) { syncErr = "Kein Zugangscode"; return paint(); }
  busy = true; syncErr = "";
  try {
    for (const code of codes) {
      const q = Q[code];
      const res = await fetch("/api/items/" + encodeURIComponent(code), { method: q.op === "put" ? "PUT" : "DELETE", headers: { "content-type": "application/json", "x-api-key": key }, body: q.op === "put" ? JSON.stringify(q.b) : undefined });
      if (res.status === 401 || res.status === 403) { localStorage.removeItem(KK); noKey = false; syncErr = "Zugangscode falsch"; break; }
      if (res.status >= 500) throw new Error("server");
      if (res.status === 400) syncErr = code + " wurde abgelehnt";
      else okAt = Date.now();
      if (Q[code] === q) delete Q[code];
      saveQ();
    }
  } catch (e) { syncErr = "nicht erreichbar"; }
  busy = false; paint();
}

renderForm(); syncAll(); setInterval(flush, 20000);
</script>
</body>
</html>
