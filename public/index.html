:root{--bg:#fbf3dc;--card:#fffaea;--crumb:#f3e2a5;--crust:#dca24a;--ink:#2a1b0b;--mute:#7d6644;--line:#ead9a6;--acc:#8a5a1e;--accbg:#f6e3ae;--gold:#c98a2b;--ok:#3d7a3a;--okbg:#e3f0d2;--warn:#a85f00;--warnbg:#fde9bd;--bad:#b33a2a;--badbg:#f9ddd5;--side:#2a1b0b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif;display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
.side{position:sticky;top:0;height:100vh;background:var(--side);color:#fbf3dc;padding:20px 14px;display:flex;flex-direction:column;gap:6px;border-right:4px solid var(--crust)}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px 16px;font-weight:800;font-size:19px;line-height:1.15}
.brand img{width:46px;height:auto}.brand small{display:block;font-weight:500;font-size:12px;color:#d8c48f}
.nav{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:2px solid transparent;border-radius:12px;padding:11px 12px;font-weight:700;color:#e9d9a8}
.nav:hover{background:rgba(255,255,255,.07)}.nav.on{background:var(--crumb);color:var(--ink);border-color:var(--crust)}
.side h4{margin:18px 8px 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#a99566}
.side .mini{background:none;border:0;text-align:left;padding:7px 12px;border-radius:8px;color:#d8c48f;font-size:13.5px}.side .mini:hover{background:rgba(255,255,255,.07);color:#fff}
.side .sp{flex:1}.side .foot{font-size:11.5px;color:#a99566;padding:0 8px}
.content{padding:22px 26px 50px;max-width:1380px;width:100%}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}.top h1{margin:0;font-size:24px;font-weight:800;flex:1}.top h1 small{display:block;font-size:13px;font-weight:500;color:var(--mute)}
.panel,.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 3px 0 var(--line)}
h2{font-size:15px;font-weight:800;margin:0 0 6px}.card>h2{color:var(--mute);font-size:13px;margin-bottom:12px}
h3{font-size:14px;font-weight:800;margin:0 0 8px;display:flex;align-items:center;gap:8px}
h3 i{font-style:normal;display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--crust);color:var(--ink);font-size:12px}
.hint{color:var(--mute);font-size:13px;margin:0 0 10px}
.w{display:grid;grid-template-columns:280px minmax(0,1fr) 310px;gap:16px;align-items:start}
.step{border-top:2px dashed var(--line);margin-top:16px;padding-top:16px}
label.l{display:block;font-size:13px;font-weight:700;margin:10px 0 4px}
input[type=text],input[type=date],input[type=time],input[type=password],textarea,select{width:100%;font:inherit;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:10px;padding:8px 10px}
textarea{resize:vertical;min-height:70px}
input.bad{border-color:var(--bad);background:var(--badbg)}
input:focus,textarea:focus,button:focus-visible,select:focus{outline:3px solid var(--gold);outline-offset:1px}
.err{color:var(--bad);font-size:12.5px;margin-top:3px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.row{display:flex;gap:8px;align-items:flex-end}.row>div{flex:1}
.btn{background:var(--acc);color:#fff8e1;border:0;border-radius:10px;padding:9px 14px;font-weight:800;box-shadow:0 3px 0 #5d3b10}.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #5d3b10}
.btn.sec{background:var(--accbg);color:var(--acc);box-shadow:0 3px 0 var(--crust)}.btn.sm{padding:8px 10px;white-space:nowrap}.btn.full{width:100%;margin-top:14px}
.btn.line{background:transparent;color:var(--ink);border:2px solid var(--line);box-shadow:none}.btn.danger{background:transparent;color:var(--bad);border:2px solid #e8b3a8;box-shadow:none}
.lc{display:flex;align-items:stretch;border:2px solid var(--line);border-radius:10px;background:#fff;overflow:hidden}.lc:focus-within{outline:3px solid var(--gold)}.lc span{background:var(--crumb);color:var(--acc);font-weight:800;padding:8px 10px;border-right:2px solid var(--line)}.lc input{border:0;border-radius:0;outline:0!important;letter-spacing:.08em;font-weight:700}
.chk{display:flex;gap:8px;align-items:center;margin:8px 0}
.item{display:block;width:100%;text-align:left;background:none;border:2px solid transparent;border-radius:10px;padding:8px 10px;margin-bottom:4px}
.item:hover{background:#fff}.item.on{background:var(--crumb);border-color:var(--crust)}.item small{display:block;color:var(--mute)}
.tag{font-size:12px;font-weight:800;border-radius:99px;padding:1px 9px;margin-left:6px;white-space:nowrap}
.t0{background:var(--warnbg);color:var(--warn)}.t1{background:#e5dcff;color:#5a45b5}.t2{background:var(--okbg);color:var(--ok)}
.box{border-radius:10px;padding:9px 12px;font-size:13.5px;margin:0 0 10px}.box.bad{background:var(--badbg);color:var(--bad)}.box.warn{background:var(--warnbg);color:var(--warn)}.box.ok{background:var(--okbg);color:var(--ok)}.box ul{margin:4px 0 0;padding-left:18px}
.empty{color:var(--mute);padding:28px 10px;text-align:center}
.del{background:none;border:0;color:var(--mute);font-size:13px;margin-top:16px;text-decoration:underline}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);color:var(--mute)}.kv b{color:var(--ink)}
.find{display:flex;gap:6px;margin:12px 0 8px}.find select{width:auto}
.pos{color:var(--ok)}.neg{color:var(--bad)}.warnc{color:var(--warn)}
/* analyse */
.seg{display:inline-flex;background:var(--crumb);border:2px solid var(--crust);border-radius:12px;padding:3px;gap:3px;margin-bottom:16px;flex-wrap:wrap}
.seg button{background:none;border:0;border-radius:9px;padding:7px 16px;font-weight:700;color:var(--mute)}.seg button.on{background:var(--acc);color:#fff8e1}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px;margin-bottom:14px}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c6{grid-column:span 6}.c8{grid-column:span 8}.c12{grid-column:span 12}
.kpi .v{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.15}.kpi small{color:var(--mute)}.kpi h2{margin-bottom:4px}
.kpi.hot{background:var(--crumb);border-color:var(--crust)}
.big{font-size:clamp(34px,4.4vw,50px);font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:2px 0 6px}
.pill{display:inline-block;font-size:12px;font-weight:800;border-radius:99px;padding:3px 11px;background:var(--okbg);color:var(--ok)}.pill.neg{background:var(--badbg);color:var(--bad)}
svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:16px;font-size:12px;color:var(--mute);margin-top:8px}.legend s{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.donut{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.ring{width:140px;height:140px;border-radius:50%;display:grid;place-items:center;flex:none}
.ring div{width:100px;height:100px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center;font-size:12px;color:var(--mute);line-height:1.2}.ring b{display:block;font-size:28px;color:var(--ink)}
.lg{flex:1;min-width:120px}.lg div{display:flex;align-items:center;gap:8px;margin:6px 0;color:var(--mute)}.lg s{width:11px;height:11px;border-radius:50%;display:inline-block}.lg b{color:var(--ink);margin-left:auto}
.bars{display:flex;align-items:flex-end;gap:4px;height:150px;padding-top:6px}
.bc{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;min-width:0;position:relative}
.bc i{display:block;width:100%;height:var(--h);min-height:3px;border-radius:5px 5px 2px 2px;background:linear-gradient(180deg,var(--gold),var(--crust))}.bc.z i{background:var(--line)}.bc:hover i{filter:brightness(.85)}
.bc span{font-size:10.5px;color:var(--mute);height:14px;white-space:nowrap}
.bc:hover::after{content:attr(data-t);position:absolute;bottom:calc(100% - 4px);left:50%;transform:translateX(-50%);background:var(--ink);color:#fff8e1;font-size:11px;font-weight:700;padding:2px 8px;border-radius:7px;white-space:nowrap;z-index:3}
.lh{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line)}.lh:first-of-type{border-top:0}.lh small{color:var(--mute)}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center}.tools input{flex:1;min-width:170px}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips button{background:transparent;border:2px solid var(--line);border-radius:99px;padding:5px 13px;color:var(--mute);font-weight:700}.chips button.on{background:var(--acc);color:#fff8e1;border-color:var(--acc)}
.wrap{overflow:auto;max-height:560px;border-radius:12px;border:2px solid var(--line)}
table{width:100%;border-collapse:collapse;min-width:900px;background:#fff}
th{position:sticky;top:0;background:var(--crumb);text-align:left;font-size:12px;font-weight:800;color:var(--acc);padding:10px 12px;cursor:pointer;user-select:none;white-space:nowrap}th.on::after{content:attr(data-d);margin-left:5px}
td{padding:10px 12px;border-top:1px solid var(--line);white-space:nowrap}tbody tr:hover{background:#fff6d6}td.n,th.n{text-align:right}td.code{font-weight:800}
.ed{background:none;border:2px solid var(--line);border-radius:8px;padding:2px 9px;font-size:12px;font-weight:700;color:var(--acc)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff8e1;font-weight:700;padding:10px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s;display:flex;gap:14px;align-items:center;z-index:50}
#toast.show{opacity:1;pointer-events:auto}#toast button{background:var(--crust);color:var(--ink);border:0;border-radius:8px;padding:3px 10px;font-weight:800}
dialog{border:3px solid var(--crust);border-radius:18px;background:var(--card);color:var(--ink);padding:24px;width:min(380px,92vw)}dialog::backdrop{background:rgba(42,27,11,.6)}
dialog img{width:56px;display:block;margin:0 auto 8px}dialog h2{text-align:center;font-size:18px}dialog .hint{text-align:center}
@media (max-width:1100px){.w{grid-template-columns:1fr}.c3{grid-column:span 6}.c4,.c8,.c6{grid-column:span 12}}
@media (max-width:860px){body{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;border-right:0;border-bottom:4px solid var(--crust);padding:12px}.brand{padding:0 8px 0 0}.nav{width:auto}.side h4,.side .sp,.side .foot{display:none}.content{padding:16px 14px 40px}}
@media (max-width:520px){.g2{grid-template-columns:1fr}.c3{grid-column:span 12}}
</style>
</head>

  <div class="row" style="margin-top:14px"><button class="btn line" id="pc" type="button" style="flex:0 0 auto">Abbrechen</button><button class="btn" id="po" type="button" style="flex:1">Öffnen</button></div></dialog>

<script>
"use strict";
const CODE = "274015";                 // <- hier den Zugangscode ändern
const KEY = "bf_v1", UIK = "bf_ui_v1", OLD = "rs_v2";
const STATUS = ["Offen", "Online", "Verkauft"], COL = ["#e0a030", "#7d63d6", "#5a9a3c"];
const $ = id => document.getElementById(id), pad = n => String(n).padStart(2, "0");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const eur = n => n.toLocaleString("de-DE", { style: "currency", currency: "EUR" });

/* ---------- Speicher ---------- */
const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch (e) { return d; } };
let items = load(KEY, null) ?? load(OLD, []);
const ui = Object.assign({ cur: "", wq: "", wst: "alle", rg: "alle", sub: "ov", aq: "", ast: "alle", key: "sold", dir: -1, d: { nc: "", nmin: "", nmax: "" } }, load(UIK, {}));
const store = () => { try { localStorage.setItem(KEY, JSON.stringify(items)); } catch (e) { toast("Speichern fehlgeschlagen (Speicher voll?)"); } };
const persist = () => { touch(); store(); queue(); };
const saveUI = () => { try { localStorage.setItem(UIK, JSON.stringify(ui)); } catch (e) {} };
const cur = () => items.find(i => i.code === ui.cur) || null;
let tried = false, unlocked = false, tab = "w";

function toast(t, label, fn) {
  const e = $("toast"); $("tt").textContent = t; e.querySelector("button")?.remove();
  if (label) { const b = document.createElement("button"); b.textContent = label; b.onclick = () => { fn(); e.classList.remove("show"); }; e.append(b); }
  e.classList.add("show"); clearTimeout(toast.h); toast.h = setTimeout(() => e.classList.remove("show"), label ? 6000 : 2200);
}

/* ---------- Hilfsfunktionen ---------- */
function money(str) { const s = String(str ?? "").trim().replace(/€|\s/g, "").replace(",", "."); return /^\d{1,6}(\.\d{1,2})?$/.test(s) ? Number(s) : null; }
const stamp = (d, t) => (d && t) ? new Date(d + "T" + t) : null;
const ms = (d, t) => { const x = stamp(d, t); return x && !isNaN(x) ? x.getTime() : null; };
const nowParts = (m = Date.now()) => { const n = new Date(m); return { d: n.getFullYear() + "-" + pad(n.getMonth() + 1) + "-" + pad(n.getDate()), t: pad(n.getHours()) + ":" + pad(n.getMinutes()) }; };
const fdt = m => new Date(m).toLocaleString("de-DE", { day: "2-digit", month: "2-digit", year: "2-digit", hour: "2-digit", minute: "2-digit" });
const dur = v => { const m = Math.max(0, Math.round(v / 6e4)), d = Math.floor(m / 1440), h = Math.floor(m % 1440 / 60); return d ? d + " Tg. " + h + " Std." : h ? h + " Std. " + (m % 60) + " Min." : m + " Min."; };
const dayKey = m => nowParts(m).d;
// abgeleitete Werte eines Auftrags
function D(i) {
  const o = { on: ms(i.onDate, i.onTime), sold: ms(i.sDate, i.sTime), buy: money(i.buy), sp: money(i.sPrice), ship: money(i.ship), min: money(i.min), max: money(i.max) };
  o.st = o.sold && o.sp != null ? 2 : o.on ? 1 : 0;
  o.gain = o.sp != null ? o.sp - (o.buy || 0) - (o.ship || 0) : null;
  o.stand = o.on && o.sold && o.sold >= o.on ? o.sold - o.on : null;
  o.oor = o.sp != null && ((o.min != null && o.sp < o.min) || (o.max != null && o.sp > o.max));
  return o;
}

/* ---------- Prüfung ---------- */
function check(i) {
  const err = {}, warn = [], now = Date.now() + 60000;
  const bad = (k, msg, req) => { if (!err[k]) err[k] = { msg, req: !!req }; };
  const when = (dk, tk, needed) => {
    if (!i[dk] && !i[tk]) { if (needed) { bad(dk, "Datum fehlt", 1); bad(tk, "Uhrzeit fehlt", 1); } return null; }
    if (!i[dk]) { bad(dk, "Datum fehlt", 1); return null; }
    if (!i[tk]) { bad(tk, "Uhrzeit fehlt (z. B. 14:35)", 1); return null; }
    const d = stamp(i[dk], i[tk]);
    if (isNaN(d)) { bad(dk, "Ungültiges Datum oder Uhrzeit"); return null; }
    if (d > now) { bad(dk, "Liegt in der Zukunft"); return null; }
    return d;
  };
  const amount = (k, needed, zero) => {
    if (!String(i[k] ?? "").trim()) { if (needed) bad(k, "Betrag fehlt", 1); return null; }
    const v = money(i[k]);
    if (v === null) { bad(k, "Ungültiger Betrag, so: 12,33"); return null; }
    if (!zero && v === 0) { bad(k, "Muss größer als 0 sein"); return null; }
    return v;
  };
  if (!i.codeOk) bad("codeOk", "Bitte bestätigen: Lagercode steht in der Beschreibung", 1);
  const on = when("onDate", "onTime", true), buy = amount("buy", true, true);
  if (String(i.min ?? "").trim() && money(i.min) === null) bad("min", "Ungültig, so: 12,33");
  if (String(i.max ?? "").trim() && money(i.max) === null) bad("max", "Ungültig, so: 12,33");
  const started = ["sDate", "sTime", "sPrice", "ship"].some(k => String(i[k] ?? "").trim());
  let sold = null, sp = null, ship = null;
  if (started) {
    sold = when("sDate", "sTime", true); sp = amount("sPrice", true, false); ship = amount("ship", true, true);
    if (on && sold && sold < on) bad("sDate", "Verkauf liegt vor dem Online-Zeitpunkt");
  }
  if (sp !== null) {
    const d = D(i);
    if (d.oor) warn.push("Verkaufspreis liegt außerhalb der Preisvorgabe (" + (i.min || "?") + " bis " + (i.max || "?") + " €).");
    if (buy !== null && sp < buy + (ship || 0)) warn.push("Der Verkauf macht Verlust.");
  }
  return { err, warn };
}

/* ---------- Datenverfasser ---------- */
function field(k, label, type, extra) {
  const v = esc(cur()[k] ?? ""), attr = type === "text" ? ' inputmode="decimal" placeholder="0,00"' : "";
  return `<div><label class="l" for="f_${k}">${label}</label><input type="${type}" id="f_${k}" data-k="${k}" value="${v}"${attr}${extra || ""}><div class="err" id="e_${k}"></div></div>`;
}
function renderList() {
  const q = ui.wq.toLowerCase(), all = items.map((i, n) => [i, D(i)]);
  const rows = all.filter(([i, d]) => (ui.wst === "alle" || STATUS[d.st] === ui.wst) && (i.code.toLowerCase().includes(q) || (i.note || "").toLowerCase().includes(q)));
  $("cnt").textContent = "(" + rows.length + (rows.length !== items.length ? " von " + items.length : "") + ")";
  $("list").innerHTML = rows.length ? rows.map(([i, d]) => `<button type="button" class="item${i.code === ui.cur ? " on" : ""}" data-c="${esc(i.code)}">${esc(i.code)}<span class="tag t${d.st}">${STATUS[d.st]}</span><small>${d.on ? "online seit " + fdt(d.on) : "noch nicht online"}</small></button>`).join("") : `<div class="empty">${items.length ? "Keine Treffer." : "Noch keine Aufträge."}</div>`;
}
function renderForm() {
  const i = cur(), el = $("form"); tried = false;
  if (!i) { el.innerHTML = '<div class="empty">Wähle links einen Auftrag aus oder lege einen neuen Lagercode an.</div>'; showSum(); return; }
  el.innerHTML = `
    <h2>Lagercode ${esc(i.code)}</h2>
    <div class="g2">${field("min", "Preisvorgabe von (€)", "text")}${field("max", "Preisvorgabe bis (€)", "text")}</div>
    <div class="step"><h3><i>1</i>Online gestellt</h3>
      <div class="chk"><input type="checkbox" id="f_codeOk" data-ck="codeOk"${i.codeOk ? " checked" : ""}><label for="f_codeOk">Lagercode steht in der Vinted-Beschreibung</label></div><div class="err" id="e_codeOk"></div>
      <div class="row">${field("onDate", "Datum", "date")}${field("onTime", "Uhrzeit", "time")}<button type="button" class="btn sec sm" data-now="on">Jetzt</button></div>

$("nw").onclick = () => show("w");
$("na").onclick = () => { if (unlocked) show("a"); else { $("pw").value = ""; $("pe").textContent = ""; $("lock").showModal(); $("pw").focus(); } };
function tryCode() { if ($("pw").value === CODE) { unlocked = true; $("lock").close(); show("a"); } else { $("pe").textContent = "Falscher Code"; $("pw").select(); } }
$("po").onclick = tryCode; $("pc").onclick = () => $("lock").close(); $("pw").addEventListener("keydown", e => { if (e.key === "Enter") tryCode(); });

/* ---------- Daten-Funktionen ---------- */
$("bk").onclick = () => { if (!items.length) return toast("Keine Daten zum Sichern"); dl("brotfund-backup-" + nowParts().d + ".json", "application/json", JSON.stringify({ app: "brotfund", items }, null, 1)); };
$("bl").onclick = () => $("bf").click();
$("bf").onchange = async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try {
    const j = JSON.parse(await f.text()), a = Array.isArray(j) ? j : j.items; if (!Array.isArray(a)) throw 0; let nw = 0, up = 0;
    for (const r of a) { if (!r || !r.code) continue; const x = items.findIndex(i => i.code.toLowerCase() === String(r.code).toLowerCase()); if (x >= 0) { items[x] = r; up++; } else { items.push(r); nw++; } }
    persist(); show(tab); toast(nw + " neu, " + up + " aktualisiert");
  } catch (err) { toast("Backup-Datei nicht lesbar"); }
};
$("demo").onclick = () => {
  const now = Date.now(); let seed = 7; const rnd = () => (seed = seed * 16807 % 2147483647) / 2147483647;
  for (let n = 1; n <= 36; n++) {
    const on = now - (rnd() * 26 + 1) * 864e5, buy = Math.round((3 + rnd() * 14) * 2) / 2, min = Math.round(buy * 1.8), max = min + 8, r = rnd(), f = x => String(x).replace(".", ",");
    const o = { code: "LC-" + (100200 + n), min: f(min), max: f(max), buy: f(buy.toFixed(2)), codeOk: true, note: "Beispielartikel " + n, created: now, demo: 1 };
    if (r > .9) { o.codeOk = false; } else { const p = nowParts(on); o.onDate = p.d; o.onTime = p.t; }
    if (r < .72) {
      let s = on + (.1 + rnd() * rnd() * 14) * 864e5; if (s > now) s = now - 36e5; s = new Date(s).setHours(Math.min(23, Math.round(8 + rnd() * rnd() * 15)), Math.floor(rnd() * 60)); if (s < on) s = on + 36e5; if (s > now) s = now - 6e4;
      const p = nowParts(s); o.sDate = p.d; o.sTime = p.t; o.sPrice = f((Math.round((min - 2 + rnd() * (max - min + 5)) * 100) / 100).toFixed(2)); o.ship = f([0, 3.49, 4.29, 5.19][Math.floor(rnd() * 4)].toFixed(2));
    }
    items = items.filter(x => x.code !== o.code); items.push(o);
  }
  persist(); show(tab); toast("Beispieldaten geladen");
};
$("wipe").onclick = () => { if (items.length && confirm("Wirklich alle " + items.length + " Aufträge löschen?\nAchtung: Das gilt für ALLE Geräte.\nTipp: Vorher ein Backup sichern.")) { items = []; ui.cur = ""; persist(); saveUI(); show(tab); } };
window.addEventListener("storage", e => { if (e.key === KEY) { items = load(KEY, []); show(tab); } });

/* ---------- Abgleich mit dem Server ---------- */
const SK = "bf_sync";
const S = Object.assign({ known: {}, lh: {}, tombs: {} }, load(SK, {}));
let rev = -1, busy = false, tmr = null;
const saveS = () => { try { localStorage.setItem(SK, JSON.stringify(S)); } catch (e) {} };
const hash = i => { const r = Object.assign({}, i); delete r.ts; return JSON.stringify(r, Object.keys(r).sort()); };
const syn = t => { $("syn").textContent = t; };
function touch() {
  const now = Date.now(), have = new Set();
  for (const i of items) {
    if (i.demo) continue;
    have.add(i.code); delete S.tombs[i.code];
    const h = hash(i);
    if (S.lh[i.code] !== h) { S.lh[i.code] = h; i.ts = S.known[i.code] !== undefined ? now : (i.ts || i.created || now); }
  }
  for (const c in S.lh) if (!have.has(c)) { delete S.lh[c]; S.tombs[c] = { code: c, del: true, ts: now, sent: false }; }
  saveS();
}
function queue() { clearTimeout(tmr); tmr = setTimeout(sync, 1500); }
function mergeIn(list) {
  const editing = tab === "w" && $("form").contains(document.activeElement), seen = new Set(); let ch = false;
  for (const r of list) {
    seen.add(r.code);
    const loc = items.find(i => i.code === r.code), lt = loc && !loc.demo ? (loc.ts || 0) : (S.tombs[r.code] ? S.tombs[r.code].ts : -1);
    if (r.ts <= lt || (editing && loc && loc.code === ui.cur)) continue;
    items = items.filter(i => i.code !== r.code);
    if (r.del) { delete S.lh[r.code]; S.known[r.code] = "DEL"; S.tombs[r.code] = { code: r.code, del: true, ts: r.ts, sent: true }; if (ui.cur === r.code) ui.cur = ""; }
    else { const n = Object.assign({}, r); delete n.del; items.push(n); S.lh[r.code] = S.known[r.code] = hash(n); delete S.tombs[r.code]; }
    ch = true;
  }
  let again = false;
  for (const i of items) if (!i.demo && !seen.has(i.code)) { delete S.known[i.code]; again = true; }
  for (const c in S.tombs) if (!seen.has(c)) { S.tombs[c].sent = false; again = true; }
  if (ch) { items.sort((a, b) => (b.created || 0) - (a.created || 0)); store(); show(tab); }
  saveS(); if (again) queue();
}
async function sync() {
  if (busy) return queue(); busy = true;
  const out = items.filter(i => !i.demo && /^LC-\d{6}$/.test(i.code) && S.known[i.code] !== hash(i)).map(i => Object.assign({}, i)).concat(Object.values(S.tombs).filter(x => !x.sent));
  try {
    const k = localStorage.getItem("bf_key"), res = await fetch("/api/sync", { method: "POST", headers: Object.assign({ "content-type": "application/json" }, k ? { "x-api-key": k } : {}), body: JSON.stringify({ rev, items: out }) });
    if (res.status === 401) { syn("Zugang fehlt – Link mit ?k=… öffnen"); busy = false; return; }
    if (!res.ok) throw new Error("server");
    const d = await res.json();
    for (const o of out) { if (o.del) { S.tombs[o.code].sent = true; S.known[o.code] = "DEL"; } else S.known[o.code] = hash(o); }
    if (!d.unchanged) { rev = d.rev; mergeIn(d.items); }
    saveS(); syn("Verbunden ✓ " + nowParts().t);
  } catch (e) { syn("Offline – wird nachgeholt"); }
  busy = false;
}
function startSync() { touch(); store(); syn("Verbinde …"); sync(); setInterval(sync, 30000); document.addEventListener("visibilitychange", () => { if (!document.hidden) sync(); }); }

/* ---------- Start: immer im Datenverfasser ---------- */
["nc", "nmin", "nmax"].forEach(k => $(k).value = ui.d[k] || ""); $("nc").value = $("nc").value.replace(/\D/g, "").slice(0, 6); ncCheck();
$("wq").value = ui.wq; $("wst").value = ui.wst; if (!cur()) ui.cur = "";
show("w"); startSync();
</script>
</body>
