services:
  - type: web
    name: reselling-server
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: WRITE_KEY
        generateValue: true
      - key: READ_KEY
        generateValue: true
      - key: TZ
        value: Europe/Berlin
      - key: NODE_VERSION
        value: "20"
